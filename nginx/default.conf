server{
    listen 80;
    server_name _;

    #frontend
    location / {
        proxy_pass http://frontend:80/;
    }

    ##user management apis
    location /api/users/ {
        proxy_pass http://user_service:5000/api/users/;
    }
    location /api/auth/ {
        proxy_pass http://user_service:5000/api/auth/;
    }

    #restaurant api
    location /restaurants/ {
        proxy_pass http://restaurant_service:4004/restaurants/;
    }
    ##article apis
    location /api/articles/ {
        proxy_pass http://article_service:4005/articles/;
    }

    ##delivery apis
    location /api/deliveries/ {
        proxy_pass http://delivery_service:3002/api/deliveries/;
    }

    ##order apis
    location /api/orders/ {
        proxy_pass http://order_service:3001/api/orders/;
    }
    location /api/cart/ {
        proxy_pass http://order_service:3001/api/cart/;
    }

    #payment apis
    location /api/payments/ {
        proxy_pass http://payment_service:5002/api/payments;
    }
}